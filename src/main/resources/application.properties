spring.application.name=stocksense
server.port=${PORT:8081}
server.error.include-message=never

# ----------------------------------------------------------------------
# Database. Default = local H2 file DB (zero setup).
# docker-compose / production: set DB_URL to a MySQL JDBC URL, e.g.
# jdbc:mysql://localhost:3306/stocksense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# ----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/stocksense;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

# ----------------------------------------------------------------------
# Market data providers, tried in order. The simulator is an offline fallback.
# Remove "simulated" if you never want fake data to be served.
# ----------------------------------------------------------------------
stocksense.market.providers=${MARKET_PROVIDERS:yahoo,twelvedata,simulated}
stocksense.market.twelve-data-key=${TWELVE_DATA_API_KEY:}
stocksense.market.timeout-seconds=${MARKET_TIMEOUT_SECONDS:10}

# ----------------------------------------------------------------------
# Python ML microservice
# ----------------------------------------------------------------------
stocksense.ml.base-url=${ML_SERVICE_URL:http://localhost:8000}
stocksense.ml.timeout-seconds=${ML_TIMEOUT_SECONDS:180}

# Daily job that scores past predictions against what actually happened
stocksense.evaluation.cron=${EVALUATION_CRON:0 30 18 * * *}

# Validate every SOAP request against stocksense.xsd
stocksense.ws.validate-requests=true

logging.level.com.stocksense=INFO
