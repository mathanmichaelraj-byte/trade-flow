spring.application.name=tradeflow

# Port 8080 is commonly taken by Apache; TradeFlow runs on 8081 by default.
server.port=${PORT:8081}

# ----------------------------------------------------------------------
# External market-data API
# ----------------------------------------------------------------------
# provider = simulated (default, no key needed) | alphavantage
# MARKET_API_KEY -> get a free key at https://www.alphavantage.co/support/#api-key
# The app falls back to the simulator automatically when the Alpha Vantage
# provider is not configured, unavailable, rate-limited or failing.
market.provider=${MARKET_PROVIDER:simulated}
market.api-key=${MARKET_API_KEY:}
market.base-url=${MARKET_BASE_URL:https://www.alphavantage.co/query}